apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: buzz-agents

commonLabels:
  app.kubernetes.io/name: buzz-agent-prime
  app.kubernetes.io/version: "0.1.0"

resources:
  - statefulset.yaml
  - service.yaml
  - network-policy.yaml

configMapGenerator:
  - name: buzz-agent-prime-config
    literals:
      - BUZZ_RELAY_URL=wss://buzz.happyvertical.com
      - BUZZ_AGENT_PRIME_MAX_SESSIONS="4"
      - BUZZ_ACP_RESPOND_TO=owner-only
      - BUZZ_ACP_HEARTBEAT_INTERVAL="0"

secretGenerator:
  - name: buzz-agent-prime-secrets
    literals:
      - BUZZ_PRIVATE_KEY=change-me-nsec-or-hex
      - OPENAI_API_KEY=change-me
    # Override these placeholder values in your private overlay.
    # Production clusters: use ExternalSecret (Warden) instead of
    # literal values — reference the ExternalSecret CR in your overlay
    # and remove this secretGenerator.
