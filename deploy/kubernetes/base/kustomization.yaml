apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: buzz-agents

labels:
  - pairs:
      app.kubernetes.io/name: buzz-agent-prime

resources:
  - namespace.yaml
  - statefulset.yaml
  - service.yaml
  - network-policy.yaml

patches:
  - target:
      kind: StatefulSet
      name: buzz-agent-prime
    patch: |-
      - op: add
        path: /spec/template/metadata/labels/app.kubernetes.io~1version
        value: "0.1.0"

configMapGenerator:
  - name: buzz-agent-prime-config
    literals:
      - BUZZ_RELAY_URL=wss://buzz.happyvertical.com
      - BUZZ_AGENT_PRIME_MAX_SESSIONS="4"
      - BUZZ_ACP_RESPOND_TO=owner-only
      - BUZZ_ACP_HEARTBEAT_INTERVAL="0"

# Secrets are NOT in the base.  The base references an independently
# provisioned Secret named `buzz-agent-prime-secrets` (created by your
# environment, ExternalSecret, or Warden). The example overlay uses the same
# stable external Secret reference and contains no credentials.
#
# A production overlay can wire an ExternalSecret CR (or equivalent) through
# the cluster's IaC, targeting that exact Secret name.
