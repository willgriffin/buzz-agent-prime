apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: buzz-agent-prime
spec:
  serviceName: buzz-agent-prime
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: buzz-agent-prime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buzz-agent-prime
    spec:
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      # Kubernetes does not create a missing subPath. Create the workspace in
      # the state PVC before mounting it at /workspace in the application
      # container, so pod replacement keeps repository checkouts durable.
      initContainers:
        - name: initialize-workspace
          image: busybox:1.36.1
          command: ["sh", "-ec", "mkdir -p /var/lib/buzz-agent-prime/workspace"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: buzz-agent-prime-state
              mountPath: /var/lib/buzz-agent-prime
      containers:
        - name: agent
          image: ghcr.io/willgriffin/buzz-agent-prime:0.1.0
          imagePullPolicy: IfNotPresent
          command: ["/usr/bin/tini", "--", "/usr/local/bin/buzz-agent-prime", "serve"]

          envFrom:
            - configMapRef:
                name: buzz-agent-prime-config
            - secretRef:
                name: buzz-agent-prime-secrets

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true

          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 4Gi

          volumeMounts:
            - name: buzz-agent-prime-state
              mountPath: /var/lib/buzz-agent-prime
            - name: buzz-agent-prime-state
              mountPath: /workspace
              subPath: workspace
            - name: tmp
              mountPath: /tmp

          livenessProbe:
            exec:
              command:
                - /usr/local/bin/buzz-agent-prime
                - doctor
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3

          readinessProbe:
            exec:
              command:
                - /usr/local/bin/buzz-agent-prime
                - doctor
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 1

      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi

  volumeClaimTemplates:
    - metadata:
        # Keep this established name: it resolves the pod mounts and preserves
        # the existing buzz-agent-prime-state-buzz-agent-prime-0 PVC.
        name: buzz-agent-prime-state
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
