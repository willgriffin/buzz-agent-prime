apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: buzz-agents

resources:
  - ../../base

nameSuffix: -example

# Provision buzz-agent-prime-secrets before applying this overlay. It is an
# external, stable Secret reference: the sample deliberately contains no
# credentials or secret generator. See docs/deployment/kubernetes.md.

# Override relay URL for a specific environment.
configMapGenerator:
  - name: buzz-agent-prime-config
    behavior: merge
    literals:
      - BUZZ_RELAY_URL=wss://buzz.happyvertical.com
